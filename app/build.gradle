plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lunarstar.qpro5ghz'
    compileSdk 34

    defaultConfig {
        applicationId "com.lunarstar.qpro5ghz"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly project(':xposed-stubs')
}
